name: PR292 merged-image publication evidence
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr292-merged-00f55972-evidence
  cancel-in-progress: false
env:
  IMAGE: quay.io/stackstate/stackstate-k8s-process-agent
jobs:
  published-image-evidence:
    name: Published full-image evidence (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            digest: sha256:ab817bda6c5e53b65a5c804eb0c30cbe6b06b4ba771285f94eb89b5e91f7cff1
          - arch: arm64
            runner: ubuntu-24.04-arm
            digest: sha256:b4f431ac216e0e111eab70937749b49d5a6ae05cad68ca87904e40316a0523a5
    steps:
      - name: Check out merged source and exceptions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 00f55972777a43e1281461cb5696e9ec09bdef34
          persist-credentials: false

      - name: Download tested binary from merge CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: process-agent-${{ matrix.arch }}
          path: tested
          github-token: ${{ github.token }}
          run-id: 36998783077

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify original signed index and runtime membership
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p reports
          index="${IMAGE}@sha256:a4919324549fe040eee1b66f83b885ed511ada6b2a6b7ec50cde01a172cc9d92"
          docker buildx imagetools inspect --raw "${index}" > reports/published-index.json
          jq -e --arg arch "${ARCH}" --arg digest "${PLATFORM_DIGEST}" '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux" and .digest == $digest)' reports/published-index.json > reports/platform-descriptor.json
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com --certificate-identity=https://github.com/StackVista/stackstate-process-agent/.github/workflows/ci.yml@refs/heads/master "${index}" > reports/index-signature.json 2> reports/index-signature-verification.log

      - name: Resolve and inspect published architecture image
        id: published
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p reports
          digest="${IMAGE}@${PLATFORM_DIGEST}"
          docker pull --platform "linux/${ARCH}" "${digest}"
          echo "image=${digest}" >> "${GITHUB_OUTPUT}"
          docker image inspect "${digest}" > reports/image-inspect.json
          printf '%s\n' "${digest}" > reports/image-digest.txt
          test "$(docker image inspect --format '{{.Architecture}}' "${digest}")" = "${ARCH}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest}")" = 00f55972777a43e1281461cb5696e9ec09bdef34
          docker run --rm --entrypoint /opt/stackstate-agent/bin/agent/process-agent "${digest}" -version | tee reports/version.txt
          grep -F 'Version: 00f55972' reports/version.txt
          container="$(docker create "${digest}")"
          docker cp "${container}:/opt/stackstate-agent/bin/agent/process-agent" /tmp/pr292-process-agent
          docker rm "${container}"
          sha256sum /tmp/pr292-process-agent > reports/binary-sha256.txt
          sha256sum tested/process-agent > reports/tested-binary-sha256.txt
          cmp tested/process-agent /tmp/pr292-process-agent

      - name: Scan published digest with Trivy, Grype and separate secrets
        uses: StackVista/image-pipeline/.github/actions/scan-image@6284a6fc006a7cc46a7f00d02c50d5f21b117b63
        with:
          image: ${{ steps.published.outputs.image }}
          mode: inform
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          with-grype: true
          exceptions-path: exceptions
          upload-sarif: false
          sarif-category: pr292-published-${{ matrix.arch }}

      - name: Assert Trivy remediation and retain complete package inventory
        env:
          SCANNED_IMAGE: ${{ steps.published.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          go version -m /tmp/pr292-process-agent > reports/binary-modules.txt
          grep -F 'vcs.revision=00f55972777a43e1281461cb5696e9ec09bdef34' reports/binary-modules.txt
          grep -F 'vcs.modified=false' reports/binary-modules.txt
          trivy image --format cyclonedx --output reports/inventory.cdx.json "${SCANNED_IMAGE}"
          jq -r '.components[]? | select(.purl // "" | startswith("pkg:rpm/")) | [.name, .version, .purl] | @tsv' reports/inventory.cdx.json | sort > reports/rpm-inventory.txt
          test -s reports/rpm-inventory.txt
          trivy --version > reports/trivy-version.txt
          grype version > reports/grype-version.txt
          grype db status > reports/grype-db-status.txt
          jq '[.matches[]? | {id:.vulnerability.id,package:.artifact.name,version:.artifact.version,severity:.vulnerability.severity}]' reports/grype.json > reports/grype-findings.json
          grep -E 'dep[[:space:]]+github.com/containerd/containerd[[:space:]]+v1\.7\.36([[:space:]]|$)' reports/binary-modules.txt
          for package in glib2-tools libgio-2_0-0 libglib-2_0-0 libgmodule-2_0-0 libgobject-2_0-0; do
            jq -e --arg package "${package}" '.components[] | select(.name == $package and .version == "2.78.6-150600.4.41.1")' reports/inventory.cdx.json > "reports/${package}.json"
          done
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == "CVE-2026-53493" or .VulnerabilityID == "SUSE-SU-2026:4367-1")] | length == 0' reports/trivy.json
          jq -e '[.Results[]?.Secrets[]?] | length == 0' reports/trivy-secrets.json
          jq '[.Results[]?.Vulnerabilities[]? | {id:.VulnerabilityID,package:.PkgName,version:.InstalledVersion,severity:.Severity}]' reports/trivy.json > reports/remaining-trivy-findings.json
          jq -n --arg source 00f55972777a43e1281461cb5696e9ec09bdef34 --arg workflow_sha "${GITHUB_SHA}" --arg run "${GITHUB_RUN_ID}" --arg arch "${ARCH}" --arg image "${SCANNED_IMAGE}" '{source:$source,workflow_sha:$workflow_sha,run:$run,arch:$arch,image:$image}' > reports/provenance.json
          (cd reports && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > reports/SHA256SUMS

      - name: Retain published full-image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr292-merged-00f55972-evidence-${{ matrix.arch }}
          path: reports/
          retention-days: 90
          if-no-files-found: error
