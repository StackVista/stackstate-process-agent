name: Renovate

on:
  schedule:
    - cron: "0 1,8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@9e21a606e5995439dc37b1da98754da9983989a0 # v1.1.0
    with:
      docker_registry_1: quay.io
      docker_registry_1_username: ${{ vars.QUAY_USER }}
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
      DOCKER_REGISTRY_1_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
