name: PR292 published-digest evidence
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr292-published-evidence
  cancel-in-progress: false
env:
  IMAGE: quay.io/stackstate/stackstate-k8s-process-agent
jobs:
  published-image-evidence:
    name: Published full-image evidence (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            digest: sha256:e0eeb7d5196e8d1121313aa6e6145c957a6e91687b3a1c045f0a5649b6b5eb65
          - arch: arm64
            runner: ubuntu-24.04-arm
            digest: sha256:ff8c855b04a56bf430adbb54de24f0274f5f51cb919cc2fa2ec8d92505172312
    steps:
      - name: Check out reviewed source and exceptions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c86d936d5833e97b6e6daccb3d1e7beec3e3b2c1
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify original signed index and runtime membership
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p reports
          index="${IMAGE}@sha256:1a45e3280e97fa2e463349d54142b3ca9737d934998b1b1df0c0d93666606ae4"
          docker buildx imagetools inspect --raw "${index}" > reports/published-index.json
          jq -e --arg arch "${ARCH}" --arg digest "${PLATFORM_DIGEST}" '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux" and .digest == $digest)' reports/published-index.json > reports/platform-descriptor.json
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com --certificate-identity=https://github.com/StackVista/stackstate-process-agent/.github/workflows/ci.yml@refs/pull/292/merge "${index}" > reports/index-signature.json 2> reports/index-signature-verification.log

      - name: Resolve and inspect published architecture image
        id: published
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p reports
          digest="${IMAGE}@${PLATFORM_DIGEST}"
          docker pull --platform "linux/${ARCH}" "${digest}"
          echo "image=${digest}" >> "${GITHUB_OUTPUT}"
          docker image inspect "${digest}" > reports/image-inspect.json
          printf '%s\n' "${digest}" > reports/image-digest.txt
          test "$(docker image inspect --format '{{.Architecture}}' "${digest}")" = "${ARCH}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${digest}")" = c86d936d5833e97b6e6daccb3d1e7beec3e3b2c1
          docker run --rm --entrypoint /opt/stackstate-agent/bin/agent/process-agent "${digest}" -version | tee reports/version.txt
          grep -F 'Version: c86d936d' reports/version.txt
          container="$(docker create "${digest}")"
          docker cp "${container}:/opt/stackstate-agent/bin/agent/process-agent" /tmp/pr292-process-agent
          docker rm "${container}"
          sha256sum /tmp/pr292-process-agent > reports/binary-sha256.txt

      - name: Scan published digest with current VEX and separate secrets
        uses: StackVista/image-pipeline/.github/actions/scan-image@6284a6fc006a7cc46a7f00d02c50d5f21b117b63
        with:
          image: ${{ steps.published.outputs.image }}
          mode: inform
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          with-grype: true
          exceptions-path: exceptions
          upload-sarif: false
          sarif-category: pr292-published-${{ matrix.arch }}

      - name: Record inventory, consumed VEX, and evaluator output
        env:
          SCANNED_IMAGE: ${{ steps.published.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          go version -m /tmp/pr292-process-agent > reports/binary-modules.txt
          grep -F 'vcs.revision=c86d936d5833e97b6e6daccb3d1e7beec3e3b2c1' reports/binary-modules.txt
          grep -F 'vcs.modified=false' reports/binary-modules.txt
          trivy image --format cyclonedx --output reports/inventory.cdx.json "${SCANNED_IMAGE}"
          jq -r '.components[]? | select(.purl // "" | startswith("pkg:rpm/")) | [.name, .version, .purl] | @tsv' reports/inventory.cdx.json | sort > reports/rpm-inventory.txt
          test -s reports/rpm-inventory.txt
          jq -e '.components[] | select(.name == "libpcre2-8-0" and .version == "10.42-150600.3.3.1")' reports/inventory.cdx.json > reports/pcre2-package.json
          jq -e '.components[] | select(.name == "glibc" and .version == "2.38-150600.14.58.1")' reports/inventory.cdx.json > reports/glibc-package.json
          trivy --version > reports/trivy-version.txt
          grype version > reports/grype-version.txt
          grype db status > reports/grype-db-status.txt
          cp exceptions/GO-2026-5932.yaml reports/GO-2026-5932.yaml
          mkdir reports/consumed-vex
          while IFS= read -r document; do
            if [[ "${document}" == */stackvista/*/pkg/golang/github.com/containerd/containerd/scan.openvex.json ]]; then
              cp "${document}" reports/consumed-vex/containerd.openvex.json
            fi
          done < reports/grype-vex-documents.txt
          test -s reports/consumed-vex/containerd.openvex.json
          sha256sum reports/consumed-vex/containerd.openvex.json > reports/consumed-vex/SHA256SUMS
          image-pipeline-evaluate --image "${SCANNED_IMAGE}" --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --mode inform --trivy-json reports/trivy.json --grype-json reports/grype.json --exceptions exceptions --sarif reports/image-pipeline.sarif 2>&1 | tee reports/evaluator.txt
          jq -n --arg source c86d936d5833e97b6e6daccb3d1e7beec3e3b2c1 --arg workflow_sha "${GITHUB_SHA}" --arg run "${GITHUB_RUN_ID}" --arg arch "${ARCH}" --arg image "${SCANNED_IMAGE}" '{source:$source,workflow_sha:$workflow_sha,run:$run,arch:$arch,image:$image}' > reports/provenance.json
          (cd reports && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > reports/SHA256SUMS

      - name: Retain published full-image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr292-published-evidence-${{ matrix.arch }}
          path: reports/
          retention-days: 90
          if-no-files-found: error
